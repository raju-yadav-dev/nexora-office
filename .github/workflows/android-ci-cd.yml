name: nexora-office Android CI/CD

on:
  # CI for active development branches
  push:
    branches: [main, dev]
  # Validate all pull requests
  pull_request:
  # Manual trigger for release/hotfix operations
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Build variant (debug/release/all)"
        required: false
        default: "all"
        type: choice
        options:
          - debug
          - release
          - all
      deploy_track:
        description: "Future release track (internal/production/none)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - internal
          - production

permissions:
  contents: write
  actions: read

concurrency:
  # Cancel stale builds for the same branch/PR to save CI minutes
  group: nexora-office-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  # Build metadata available across jobs
  APP_NAME: nexora-office
  CI_BUILD_NUMBER: ${{ github.run_number }}
  CI_SHA_SHORT: ${{ github.sha }}
  # Enables Gradle's remote build cache integration in CI
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

jobs:
  prepare:
    name: Prepare CI Metadata
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      artifact_prefix: ${{ steps.version.outputs.artifact_prefix }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version and artifact prefix
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          ARTIFACT_PREFIX="nexora-office-${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "artifact_prefix=${ARTIFACT_PREFIX}" >> "${GITHUB_OUTPUT}"
          echo "Computed VERSION_NAME=${VERSION_NAME}"

  quality:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Resolve Gradle command
        id: gradle_cmd
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "cmd=./gradlew" >> "${GITHUB_OUTPUT}"
          else
            echo "cmd=gradle" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run lint (all modules)
        run: ${{ steps.gradle_cmd.outputs.cmd }} --stacktrace --no-configuration-cache lint

      - name: Run unit tests (all modules)
        run: ${{ steps.gradle_cmd.outputs.cmd }} --stacktrace testDebugUnitTest

      - name: Upload lint and test reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-quality-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build APK/AAB Artifacts
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Resolve Gradle command
        id: gradle_cmd
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "cmd=./gradlew" >> "${GITHUB_OUTPUT}"
          else
            echo "cmd=gradle" >> "${GITHUB_OUTPUT}"
          fi

      - name: Decode Android keystore (optional for signed release)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/signing"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/signing/release.keystore"

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_variant == 'debug' || github.event.inputs.build_variant == 'all' }}
        run: ${{ steps.gradle_cmd.outputs.cmd }} --stacktrace :app:assembleDebug

      - name: Build release APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_variant == 'release' || github.event.inputs.build_variant == 'all' }}
        env:
          # Secure environment variable mapping (from repository secrets)
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NEXORA_VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
        run: ${{ steps.gradle_cmd.outputs.cmd }} --stacktrace :app:assembleRelease

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

  release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: [prepare, quality, build]
    if: always()
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 200

      - name: Build release notes markdown
        shell: bash
        run: |
          mkdir -p build/ci
          {
            echo "# nexora-office CI Release Notes"
            echo ""
            echo "- Version: ${{ needs.prepare.outputs.version_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "## Recent Changes"
            git log --pretty=format:'- %h %s (%an)' -n 25
          } > build/ci/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-release-notes
          path: build/ci/release-notes.md
          retention-days: 30

  publish-release-assets:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs: [prepare, quality, build, release-notes]
    # Auto-publish only from main branch pushes, or manually via workflow dispatch.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.prepare.outputs.artifact_prefix }}-*
          path: release-assets
          merge-multiple: true

      - name: Generate release body
        shell: bash
        run: |
          {
            echo "Automated release assets for \`${{ needs.prepare.outputs.version_name }}\`."
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > RELEASE_NOTES.md

      - name: Create or update GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version_name }}
          name: Nexora Office v${{ needs.prepare.outputs.version_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Future deployment extensions (kept as placeholders for modular scaling):
  # 1) Firebase App Distribution job (internal QA)
  # 2) Google Play deployment job (production track)
  # 3) Nightly schedule trigger with benchmarking/performance tests
